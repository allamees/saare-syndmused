# Kogub igal hommikul sündmused ja avaldab rakenduse GitHub Pages'is.
name: Uuenda sündmusi

on:
  schedule:
    - cron: "0 4 * * *"      # iga päev 04:00 UTC (06:00/07:00 Eesti aja järgi)
  workflow_dispatch:          # käsitsi käivitamine GitHubi lehelt
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Kogu sündmused
        run: python -m scraper.run
        continue-on-error: true   # kui mõni allikas on maas, avaldame eelmise faili
      - name: Salvesta events.json repositooriumi
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app/events.json
          git diff --cached --quiet || git commit -m "Sündmuste uuendus $(date -u +%F)"
          git push || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
